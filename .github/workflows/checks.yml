name: checks

# The repository argues that workflows should verify before they trust and fail
# closed. These checks apply that to the repository itself: every push is linted
# before it is believed.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  justfile:
    name: justfile syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: Parse every recipe
        # --summary fails on a syntax error without executing anything.
        run: just --justfile just/r2/justfile --summary

  python:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lint python
        run: |
          pip install ruff
          ruff check python/
